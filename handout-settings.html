<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/handouts.css?v=1.12.0"><title>Configurar teclado</title></head><body><header><h1>Teclado de porta</h1><button id="close" aria-label="Fechar">×</button></header><main id="controls" hidden><span class="badge">MESTRE / CONFIGURAÇÃO</span><form id="form"><label for="title">Nome do handout</label><input id="title" maxlength="60" required><label for="code">Senha numérica</label><input id="code" type="password" inputmode="numeric" pattern="[0-9]{1,8}" maxlength="8" autocomplete="off" placeholder="Manter senha atual"><small>1 a 8 dígitos, incluindo zeros iniciais.</small><label class="check"><input id="onTop" type="checkbox"> Sempre por cima</label><button class="primary" type="submit">Salvar configuração</button></form><div class="actions"><button id="reset">Reiniciar enigma</button><button id="solve">Resolver agora</button></div><button id="move">Travar / liberar posição</button><button id="delete" class="danger">Remover da cena</button><small>Para mover, libere o item e use a ferramenta de seleção do Owlbear. A senha é guardada neste navegador.</small></main><p id="status" role="status">Conectando…</p><script type="module" src="/src/handout-settings.js?v=1.12.0"></script></body></html>
