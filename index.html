<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arsenal • Munição</title><link rel="stylesheet" href="/styles.css?v=1.16.0"></head>
<body><main>
<header><h1 id="name">Munição</h1><button id="reload" type="button" title="Recarregar o pente" aria-label="Recarregar o pente">↻</button><button id="burst" type="button" hidden title="Gastar 10 balas carregadas">Saraivada</button><span id="count" aria-live="polite"><b id="remaining">0</b><span> / </span><span id="capacity">12</span></span><button id="settings" type="button" aria-label="Configurar carregador" title="Configurar carregador" aria-expanded="false">⚙</button></header>
<p id="status" role="status">Conectando…</p>
<section id="tracker" hidden><div id="rounds" aria-label="Munições no carregador"></div></section>
<dialog id="config"><form id="config-form">
<h2>Armamento</h2><label for="weapon">Arma e capacidade</label><select id="weapon"></select><p class="hint">Cada arma mantém sua própria munição neste personagem.</p>
<footer><button type="button" id="cancel">Cancelar</button><button class="primary" type="submit">Salvar</button></footer>
</form></dialog>
</main><script type="module" src="/src/app.js?v=1.16.0"></script></body></html>
