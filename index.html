<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Arsenal • Munição</title><link rel="stylesheet" href="/styles.css"></head>
<body><main>
<header><div><span class="eyebrow">ARSENAL / MUNIÇÃO</span><h1 id="name">Selecione um personagem</h1></div><button id="settings" aria-label="Configurar carregador" title="Configurar carregador">⚙</button></header>
<p id="status" role="status">Conectando ao Owlbear Rodeo…</p>
<section id="tracker" hidden><div class="summary"><strong><span id="remaining">0</span><small> / <span id="capacity">12</span></small></strong><span id="layout-label">PISTOLA</span></div>
<div id="rounds" aria-label="Munições no carregador"></div>
<p class="hint">Clique em uma munição para gastar ou devolver.</p>
<footer><button id="reload" class="primary">↻ Recarregar</button><button id="empty">Esvaziar</button></footer></section>
<dialog id="config"><form id="config-form"><h2>Seu carregador</h2><label for="size">Capacidade total</label><input id="size" type="number" min="1" max="60" step="1" required value="12"><label for="layout">Formato</label><select id="layout"><option value="pistol">Pistola — carregador compacto</option><option value="rifle">Fuzil — carregador alongado</option><option value="revolver">Revólver — tambor circular</option></select><p class="hint">De 1 a 60 balas. Ao aumentar, as novas posições vêm carregadas.</p><footer><button type="button" id="cancel">Cancelar</button><button class="primary" type="submit">Salvar</button></footer></form></dialog>
</main><script type="module" src="/src/app.js"></script></body></html>
