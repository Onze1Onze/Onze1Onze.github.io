<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status da ficha</title><link rel="stylesheet" href="/stats.css?v=1.15.0"></head><body><main aria-label="Status do personagem"><section id="bars">
<div class="metric hp"><div class="caption"><span>Vida</span><output id="hp-value">— / —</output></div><div id="hp-bar" class="track" role="progressbar" aria-label="Vida"><span id="hp-fill"></span></div></div>
<div class="metric san"><div class="caption"><span>Sanidade</span><output id="san-value">— / —</output></div><div id="san-bar" class="track" role="progressbar" aria-label="Sanidade"><span id="san-fill"></span></div></div>
<div class="metric pe"><div class="caption"><span>PE</span><output id="pe-value">— / —</output></div><div id="pe-bar" class="track" role="progressbar" aria-label="PE"><span id="pe-fill"></span></div></div>
</section><p id="status" role="status">Lendo ficha…</p></main><script type="module" src="/src/stats.js?v=1.15.0"></script></body></html>
