<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status da ficha</title><link rel="stylesheet" href="/stats.css?v=1.16.0"></head><body><main aria-label="Status do personagem"><header><span>FICHA / CONDIÇÃO</span><b id="condition-label">Em pé</b></header><section id="bars">
<div class="metric hp"><div class="caption"><span>Vida</span><output id="hp-value">— / —</output></div><div id="hp-bar" class="track" role="progressbar" aria-label="Vida"><span id="hp-fill"></span></div></div>
<div class="metric san"><div class="caption"><span>Sanidade</span><output id="san-value">— / —</output></div><div id="san-bar" class="track" role="progressbar" aria-label="Sanidade"><span id="san-fill"></span></div></div>
<div class="metric pe"><div class="caption"><span>PE</span><output id="pe-value">— / —</output></div><div id="pe-bar" class="track" role="progressbar" aria-label="PE"><span id="pe-fill"></span></div></div>
</section><section class="details" aria-label="Defesas e deslocamento">
<div><span>Deslocamento</span><strong id="movement-value">—</strong></div><div><span>Defesa</span><strong id="defense-value">—</strong></div><div><span>Bloqueio</span><strong id="block-value">—</strong></div><div><span>Esquiva</span><strong id="dodge-value">—</strong></div></section>
<section id="death-track" hidden aria-label="Marcadores de morte"><div><span id="death-title">Morrendo</span><small id="death-count">0 / 3</small></div><nav aria-label="Três marcadores de morte"><button class="death-mark" type="button" data-mark="0" aria-label="Primeiro marcador de morte" aria-pressed="false">Ⅰ</button><button class="death-mark" type="button" data-mark="1" aria-label="Segundo marcador de morte" aria-pressed="false">Ⅱ</button><button class="death-mark" type="button" data-mark="2" aria-label="Terceiro marcador de morte" aria-pressed="false">Ⅲ</button></nav></section>
<p id="status" role="status">Lendo ficha…</p></main><script type="module" src="/src/stats.js?v=1.16.0"></script></body></html>
